services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: screenhouse_guardian
      POSTGRES_USER: screenhouse_guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenhouse_guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://screenhouse_guardian:${POSTGRES_PASSWORD}@db:5432/screenhouse_guardian
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  postgres_data:
  media:
